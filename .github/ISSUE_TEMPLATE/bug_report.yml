name: Bug
description: "Дефект: поведение отличается от ожидаемого"
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - backend
        - frontend
        - agent
        - data
        - infra
        - docs
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Критичность
      description: Насколько дефект мешает демо или работе команды
      options:
        - Critical - блокирует демо или деплой
        - High - ломает основной сценарий
        - Medium - мешает, но есть обходной путь
        - Low - косметика
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Приложите текст ошибки или скриншот. Секреты и токены не вставляйте.
    validations:
      required: true
