<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ostrovok Muse Copilot - Preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #0B0C0E;
      color: #F4F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .mock-site-card {
      max-width: 900px;
      margin: 0 auto 30px;
      border: 1px solid #242731;
      border-radius: 16px;
      padding: 24px;
      background: #16181D;
    }
    h1 { font-size: 22px; font-weight: 800; color: #1652F0; margin-top: 0; }
    .filters-grid {
      display: flex;
      gap: 16px;
      margin: 20px 0;
      padding: 16px;
      background: #0D0E11;
      border-radius: 12px;
      border: 1px solid #242731;
    }
    .mock-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .mock-hotel-card {
      border: 1px solid #242731;
      border-radius: 12px;
      padding: 16px;
      background: #1A1D24;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="mock-site-card">
    <h1>Ostrovok.ru Mock SERP / Hotel Detail Preview</h1>
    <p style="color: #8E92A0; font-size: 13px;">Тестовая страница: эмуляция SERP с фильтрами и отельными карточками.</p>

    <div class="filters-grid">
      <label class="mock-checkbox" id="filter-breakfast">
        <input type="checkbox" id="check-breakfast">
        <span>Завтрак включен</span>
      </label>
      <label class="mock-checkbox" id="filter-pool">
        <input type="checkbox" id="check-pool">
        <span>Бассейн</span>
      </label>
      <label class="mock-checkbox" id="filter-pets">
        <input type="checkbox" id="check-pets">
        <span>Можно с питомцами</span>
      </label>
    </div>

    <div class="mock-hotel-card" data-testid="serp-hotelcard">
      <div>
        <h3 style="margin: 0 0 6px; font-size: 16px;">Гранд Отель Поляна 5*</h3>
        <p style="margin: 0; color: #8E92A0; font-size: 13px;">Красная Поляна, ул. Ачипсинская, 16</p>
      </div>
      <div style="text-align: right;">
        <span style="font-size: 18px; font-weight: 700; color: #2DD4BF;">от 12 400 ₽</span>
        <button style="display: block; margin-top: 8px; background: #1652F0; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer;">Выбрать</button>
      </div>
    </div>
  </div>

  <!-- Flying Mascot -->
  <div class="ostrovok-ghost-flyer" id="ghost-flyer" style="left: 700px; top: 180px;">
    <div class="ghost-thought-bubble visible" id="ghost-bubble">Включил фильтр: Завтрак!</div>
    <canvas class="ghost-canvas" id="preview-canvas" width="60" height="60"></canvas>
  </div>

  <!-- Floating Action Bar -->
  <div class="copilot-action-bar">
    <div class="action-bar-label">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>Агент</span>
    </div>
    <div class="action-chips">
      <button type="button" class="chip-btn" id="btn-toggle-breakfast">Включить завтрак</button>
      <button type="button" class="chip-btn" id="btn-toggle-pool">С бассейном</button>
      <button type="button" class="chip-btn" id="btn-highlight">Топ по отзывам</button>
    </div>
    <div class="action-input-form">
      <input type="text" class="action-input" placeholder="Команда агенту..." value="Включи завтрак и выбери отель" />
      <button type="button" class="icon-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button type="button" class="submit-btn">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { GhostCanvas } from "./src/ghost-canvas.js";
    import { GhostActor } from "./src/ghost-actor.js";

    const canvas = document.getElementById("preview-canvas");
    const flyer = document.getElementById("ghost-flyer");
    const bubble = document.getElementById("ghost-bubble");

    const ghost = new GhostCanvas(canvas);
    const actor = new GhostActor(flyer, ghost, bubble);

    document.getElementById("btn-toggle-breakfast")?.addEventListener("click", () => {
      actor.toggleFilterCheckbox("завтрак");
    });
    document.getElementById("btn-toggle-pool")?.addEventListener("click", () => {
      actor.toggleFilterCheckbox("бассейн");
    });
    document.getElementById("btn-highlight")?.addEventListener("click", () => {
      const card = document.querySelector('[data-testid="serp-hotelcard"]');
      actor.highlightHotelCard(card, "98% совпадение • Спа-комплекс и бассейн");
    });
  </script>
</body>
</html>
