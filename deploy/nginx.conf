# Nginx reverse proxy для голого VPS.
# Frontend (Next.js, next start -p 3000) + Backend (FastAPI/uvicorn, settings.PORT=8000).
#
# Установка на Ubuntu/Debian: sudo cp deploy/nginx.conf /etc/nginx/sites-available/ostrovok2026
#   sudo ln -s /etc/nginx/sites-available/ostrovok2026 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: подключить certbot (Let's Encrypt) поверх этого конфига — он сам допишет 443/ssl_certificate.

upstream backend_upstream {
    server 127.0.0.1:8000;
}

upstream frontend_upstream {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;  # заменить на реальный домен/IP

    client_max_body_size 2m;

    # --- SSE-эндпоинт стрима "мыслей" агента: буферизация ОБЯЗАТЕЛЬНО выключена, ---
    # --- иначе nginx копит чанки и стрим приходит рывками вместо построчной печати. ---
    location = /api/stream {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Отключает буферизацию у прокси-серверов, поддерживающих этот заголовок (fastcgi/uwsgi за nginx и т.п.)
        add_header X-Accel-Buffering no;
    }

    # --- Остальные /api/* — обычный проксинг с буферизацией, таймаут короче. ---
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Фронтенд (Next.js) — всё остальное. ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";  # для Next.js HMR/websocket в dev; в проде не мешает
    }
}
