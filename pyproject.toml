[project]
name = "ostrovok2026-backend"
version = "1.0.0"
description = "Ostrovok AI Concierge backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "chromadb==1.5.9",
    "fastapi>=0.115.0",
    "google-genai>=2.0.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
required-version = ">=0.12.5"

# Match the CPU-only Linux deployment; Windows and macOS use their PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, variables, undefined vars)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bug patterns)
    "UP",     # pyupgrade (Python 3.11 modern syntax)
    "ASYNC",  # flake8-async (asyncio issues)
]
ignore = [
    "E501",   # line-length managed by ruff format
    "B008",   # FastAPI Depends() in parameter defaults
    "B904",   # raise ... from err in except blocks
    "B905",   # zip() without strict=
    "E402",   # module level import not at top (common in sys.path scripts)
    "E731",   # lambda assignment
    "E741",   # ambiguous variable name
    "W291",   # trailing whitespace
    "W293",   # blank line contains whitespace
    "ASYNC230", # blocking open() in async def
    "ASYNC240", # blocking os.path in async def
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F401",   # allow unused imports in tests/fixtures
    "B011",   # allow assert False in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "app.db.*",
    "app.services.vector_store",
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

